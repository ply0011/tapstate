version: tapstate/v1
kind: pipeline
id: nested_orders
source: shop_src
transforms:
  - id: nested
    type: nest
    from:
      lines: lines
      orders: orders
    root:
      from: orders
      key: [id]
      embed:
        - from: lines
          on:
            order_id: id
          as: array
          path: lines
serve:
  id: serve
  from: nested
  sync:
    - id: sync_1
      source: orders_tgt
