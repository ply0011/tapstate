# Two engines that keep carrying changes after the pipeline started.
#
# Its sibling two-engines-reach-one-target proves the snapshot half: both engines' seeded rows reach one
# target. This drives the transition on both of them at once, which nothing else here does - the MySQL
# and PostgreSQL change-stream witnesses each run their engine alone, and the two-engine witness never
# starts a change stream.
#
# That gap is the reason this exists. Two capture streams in one job are not two jobs: they share a
# run, and a failure in either one takes the whole pipeline down. A case that only ever snapshots two
# engines cannot see that, and a case that streams one engine cannot either.
#
# Runs only where real connector jars are available.
name: two-engines-keep-carrying-changes
setup:
  databases:
    orders: { kind: mysql }
    shipments: { kind: postgres }
    tgt: { kind: mongo }
  connectors: [mysql, postgres, mongodb]
  apply: [src_orders.tap.yml, src_shipments.tap.yml, tgt_mongo.tap.yml, pipeline.tap.yml]
  discover: [src_orders, src_shipments]
pipeline: pipeline.tap.yml
seed:
  src_orders.orders: { rows: 5 }
  src_shipments.shipments: { rows: 4 }
steps:
  - start
  - await: { count: { tgt_mongo.orders: 5, tgt_mongo.shipments: 4 } }
  - cdc: { src_orders.orders: insert 2 }
  - await: { count: { tgt_mongo.orders: 7 } }
  - cdc: { src_shipments.shipments: insert 3 }
  - await: { count: { tgt_mongo.shipments: 7 } }
