# One capture unit per table: two single-table sources are what puts two change chains into one job,
# which is the shape a nest has to survive - the child's chain and the parent's arrive independently.
version: tapstate/v1
kind: source
id: src_items
connector: mysql
config: { host: ${SRC_HOST}, port: ${SRC_PORT}, database: ${SRC_DATABASE}, username: ${SRC_USERNAME}, password: ${SRC_PASSWORD} }
mode: cdc
tables: [ order_items ]
