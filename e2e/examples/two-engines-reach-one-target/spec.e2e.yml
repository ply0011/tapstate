# One job reading two different database engines, both halves reaching one target.
#
# This is the case the whole cross-source claim rests on, in its smallest honest form. An order lives in
# MySQL and its shipments live in PostgreSQL, and nothing in either database can see the other - so a
# view or a join is not a smaller way to do this, it is not a way to do this at all. The product is what
# reconciles them.
#
# Both counts are asserted, not their sum. An implementation that honoured only the first stream would
# satisfy a sum written as 9 by delivering nine orders and no shipments; asserting the halves separately
# is what makes "both engines arrived" the only reading that passes. The two tables reach the target
# under their own names, so each half is countable on its own.
#
# Snapshot only, admitted as op=r. The change-stream half of a cross-engine pipeline is a separate
# question with its own witness, and folding it in here would mean this case failed for two unrelated
# reasons and said neither.
#
# Runs only where real connector jars are available: naming no -Dtapstate.e2e.connectors-dir skips this
# example, naming a directory whose jars do not resolve fails it. The default build therefore stays
# green without it; the real-connector lane is where it always runs. It is the first example in this
# directory to ask for two source engines at once, which is what the postgres store kind was added for.
name: two-engines-reach-one-target
setup:
  databases:
    orders: { kind: mysql }
    shipments: { kind: postgres }
    tgt: { kind: mongo }
  connectors: [mysql, postgres, mongodb]
  apply: [src_orders.tap.yml, src_shipments.tap.yml, tgt_mongo.tap.yml, pipeline.tap.yml]
  discover: [src_orders, src_shipments]
pipeline: pipeline.tap.yml
seed:
  src_orders.orders: { rows: 5 }
  src_shipments.shipments: { rows: 4 }
steps:
  - start
  - await: { count: { tgt_mongo.orders: 5, tgt_mongo.shipments: 4 } }
