version: tapstate/v1
kind: pipeline
id: cross_engine_nest
source: [ src_orders, src_shipments ]
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: order_doc
    type: nest
    from: { o: orders, s: shipments }
    root:
      from: o
      key: [ id ]
      embed:
        - { from: s, on: { order_id: id }, as: array, path: shipments, arrayKey: [ id ] }
serve:
  from: order_doc
  sync:
    - source: tgt_mongo
