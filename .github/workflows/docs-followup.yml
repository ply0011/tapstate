name: docs-followup

# When a PR labeled `docs-needed` is merged, open a follow-up issue in
# tapstate/docs assigned to the docs owner, and (optionally) ping Feishu.
#
# Required repository secrets:
#   DOCS_REPO_TOKEN - a token that can create issues in tapstate/docs
#                     (fine-grained PAT, resource owner tapstate, repo docs,
#                     Issues: Read and write). The default GITHUB_TOKEN cannot
#                     write to another repository.
#   FEISHU_WEBHOOK  - optional. Feishu custom-bot webhook URL. If unset, the
#                     Feishu step is skipped.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'docs-needed')
    runs-on: ubuntu-latest
    steps:
      - name: Open docs follow-up issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_REPO_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.merge_commit_sha;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            // Permalinks, not branch links: the branch moves and may be deleted, and this issue is
            // read after both. The tree link is how the drafts are read exactly as they merged.
            const commit = sha ? `https://github.com/${repo}/commit/${sha}` : '(no merge commit recorded)';
            const drafts = sha ? `https://github.com/${repo}/tree/${sha}/docs` : '(no merge commit recorded)';
            const body = [
              `Documentation follow-up for merged PR ${pr.html_url}`,
              ``,
              `**Title:** ${pr.title}`,
              `**Author:** @${pr.user.login}`,
              `**Merged at:** ${pr.merged_at}`,
              `**Merged commit:** ${commit}`,
              `**Drafts as merged:** ${drafts}`,
              ``,
              `**Change summary, as the author wrote it:**`,
              pr.body || '(no description provided)',
              ``,
              `---`,
              ``,
              `The summary above should answer three things, because the pull request template asks`,
              `for them: whether follow-up is needed, where the draft is under \`docs/\`, and which`,
              `public page it is headed for. If any of the three is missing, ask on the pull request`,
              `rather than guessing - the author has the context and this issue is where it gets lost.`,
              ``,
              `Pages under \`docs/\` carry a header saying whether they are an engineering draft or a`,
              `pointer to an already published page. Publishing one means the draft here shrinks to a`,
              `\`canonical-pointer\` with its \`canonical_url\`; the executable assets beside it stay put.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: 'tapstate',
              repo: 'docs',
              title: `[docs] ${pr.title}`,
              body,
              assignees: ['heywalter'],
            });

      - name: Notify Feishu
        if: ${{ env.FEISHU_WEBHOOK != '' }}
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          text="docs follow-up needed: ${PR_TITLE} (${PR_URL}) -> assigned to heywalter in tapstate/docs"
          payload=$(jq -n --arg t "$text" '{msg_type:"text",content:{text:$t}}')
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$FEISHU_WEBHOOK"
