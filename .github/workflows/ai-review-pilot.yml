# Pilot orchestration only. CodeRabbit reviews; Claude gets one remediation pass;
# every path ends with human review. The repository's existing CI remains the
# independent build and Docker-backed integration-test authority.
name: AI review pilot

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ai-review-pilot-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    # Only CodeRabbit can start this job. Detailed eligibility is re-checked
    # through the API before the Claude credential is made available.
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'coderabbitai[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Resolve trusted pilot state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.eventName === 'pull_request_review'
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });

            const labels = new Set(pr.labels.map((label) => label.name));
            const trustedAuthors = new Set(['windfun', 'tjworks']);
            const eligible =
              trustedAuthors.has(pr.user.login) &&
              labels.has('ai-review-pilot') &&
              !pr.draft &&
              pr.base.ref === 'main' &&
              pr.head.repo?.full_name === `${owner}/${repo}`;

            core.setOutput('number', String(number));
            core.setOutput('author', pr.user.login);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('before_sha', pr.head.sha);

            if (!eligible) {
              core.notice('Ignoring a CodeRabbit event outside the trusted pilot scope.');
              core.setOutput('mode', 'noop');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const hasMarker = (marker) => comments.some((comment) =>
              comment.body?.includes(marker));

            if (hasMarker('<!-- tapstate-human-handoff:v1 -->')) {
              core.setOutput('mode', 'noop');
              return;
            }

            if (context.eventName === 'issue_comment') {
              const body = context.payload.comment.body || '';
              if (/review\s+rate[- ]limited|rate[- ]limit/i.test(body)) {
                core.setOutput('mode', 'handoff');
                core.setOutput('reason', 'CodeRabbit reported that the review was rate-limited.');
              } else {
                core.setOutput('mode', 'noop');
              }
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            const completedReviews = reviews.filter((review) =>
              review.user?.login === 'coderabbitai[bot]' &&
              review.state !== 'PENDING');
            const reviewCount = new Set(completedReviews.map((review) => review.id)).size;
            core.setOutput('review_count', String(reviewCount));

            if (reviewCount >= 2) {
              core.setOutput('mode', 'handoff');
              core.setOutput('reason', `CodeRabbit completed ${reviewCount} reviews; the two-review limit is reached.`);
            } else if (
              reviewCount === 1 &&
              !hasMarker('<!-- tapstate-claude-remediation:v1 -->')
            ) {
              core.setOutput('mode', 'remediate');
            } else {
              core.setOutput('mode', 'noop');
            }

      - name: Check out the trusted PR branch
        if: steps.state.outputs.mode == 'remediate'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.state.outputs.head_ref }}
          fetch-depth: 0

      - name: Address the first CodeRabbit review
        if: steps.state.outputs.mode == 'remediate'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: coderabbitai[bot]
          include_comments_by_actor: coderabbitai[bot],windfun,tjworks,github-actions[bot]
          additional_permissions: |
            actions: read
          claude_args: --max-turns 15
          prompt: |
            You are the designated remediation agent for this Tapstate pilot PR.

            Address only actionable findings from the first CodeRabbit review. Read
            CONTRIBUTING.md before changing code. Keep the patch scoped and preserve
            the repository's zero-agent-footprint policy: do not add agent instruction
            files, .claude directories, or automated-tool footers.

            For product-source changes, add or update the required end-to-end case.
            Run `mvn -B verify`; it is the repository's authoritative unit,
            architecture, and Docker-backed integration-test command. If a finding is
            incorrect or requires a product/architecture decision, explain that in the
            PR instead of guessing. Never approve or merge the PR, and never invoke
            CodeRabbit Autofix. Make at most one remediation commit on the current PR
            branch.

      - name: Record remediation and request the second review
        id: after
        if: success() && steps.state.outputs.mode == 'remediate'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number('${{ steps.state.outputs.number }}');
            const before = '${{ steps.state.outputs.before_sha }}';
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: 'Claude remediation completed.\n\n<!-- tapstate-claude-remediation:v1 -->',
            });

            if (pr.head.sha === before) {
              core.notice('Claude made no commit; handing the PR directly to a human.');
              core.setOutput('handoff', 'true');
              core.setOutput('reason', 'Claude completed the remediation assessment without changing the PR.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: '@coderabbitai review\n\nSecond and final automated review requested.\n\n<!-- tapstate-second-review-request:v1 -->',
            });
            core.setOutput('handoff', 'false');

      - name: Hand off to human review
        if: >-
          steps.state.outputs.mode == 'handoff' ||
          steps.after.outputs.handoff == 'true'
        uses: actions/github-script@v7
        env:
          AI_HUMAN_REVIEWERS: ${{ vars.AI_HUMAN_REVIEWERS }}
          HANDOFF_REASON: ${{ steps.state.outputs.reason || steps.after.outputs.reason }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number('${{ steps.state.outputs.number }}');
            const author = '${{ steps.state.outputs.author }}';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            if (comments.some((comment) =>
              comment.body?.includes('<!-- tapstate-human-handoff:v1 -->'))) {
              return;
            }

            const reviewers = (process.env.AI_HUMAN_REVIEWERS || '')
              .split(',')
              .map((value) => value.trim())
              .filter((value) => value && value !== author);

            let reviewerText = 'No eligible reviewer is configured; a maintainer must assign one.';
            if (reviewers.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: number,
                  reviewers,
                });
                reviewerText = `Requested: ${reviewers.map((name) => `@${name}`).join(', ')}.`;
              } catch (error) {
                reviewerText = `Automatic reviewer assignment failed: ${error.message}`;
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: [
                '@coderabbitai pause',
                '',
                'Human review is now required. Automated review will not continue.',
                '',
                `Reason: ${process.env.HANDOFF_REASON || 'The automated pilot cycle is complete.'}`,
                reviewerText,
                'A human remains responsible for approval and merge.',
                '',
                '<!-- tapstate-human-handoff:v1 -->',
              ].join('\n'),
            });

      - name: Escalate a Claude automation failure
        if: failure() && steps.state.outputs.mode == 'remediate'
        uses: actions/github-script@v7
        env:
          AI_HUMAN_REVIEWERS: ${{ vars.AI_HUMAN_REVIEWERS }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number('${{ steps.state.outputs.number }}');
            const author = '${{ steps.state.outputs.author }}';
            const reviewers = (process.env.AI_HUMAN_REVIEWERS || '')
              .split(',')
              .map((value) => value.trim())
              .filter((value) => value && value !== author);

            if (reviewers.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: number,
                  reviewers,
                });
              } catch (error) {
                core.warning(`Could not request reviewers: ${error.message}`);
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: [
                '@coderabbitai pause',
                '',
                'Human review is required because the Claude remediation workflow failed.',
                'Inspect the failed Actions run before continuing. No automated retry will occur.',
                '',
                '<!-- tapstate-human-handoff:v1 -->',
              ].join('\n'),
            });
