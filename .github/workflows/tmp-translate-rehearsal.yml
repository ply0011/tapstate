name: tmp-translate-rehearsal

# TEMPORARY. Delete before this branch is flipped to ready.
#
# It exists to run `.github/scripts/translate-intake.sh` once against a real engine, a real issue
# and a real `gh`, while the branch is still unmerged. The real workflow beside it cannot do that:
# an `issues` event has no branch, so GitHub runs the copy on the default branch - where this
# workflow does not exist yet. A `push` event is the only trigger that runs a branch's own workflow
# files, and a same-repository push is given the secrets.
#
# The script is the object under test and is not modified. Only the harness around it differs: the
# body arrives from `gh issue view` rather than from an event payload, which is the same string
# reaching the same environment variable.

on:
  push:
    branches: [ws/dev-workflow-lifecycle-split]

permissions:
  contents: read
  issues: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the intake translation against a real issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: 75
          TRANSLATE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATE_BASE_URL: https://api.deepseek.invalid
          TRANSLATE_MODEL: deepseek-chat
        run: |
          # Through the environment, never interpolated into this script's text.
          ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export ISSUE_BODY
          bash .github/scripts/translate-intake.sh >> "$GITHUB_STEP_SUMMARY"
